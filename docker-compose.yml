version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: quiz-postgres
    environment:
      POSTGRES_USER: quizuser
      POSTGRES_PASSWORD: quizpass
      POSTGRES_DB: quizdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizuser -d quizdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - quiz-network

  backend:
    build: ./backend
    container_name: quiz-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: quizuser
      DB_PASSWORD: quizpass
      DB_NAME: quizdb
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quiz-network
    restart: on-failure

  frontend:
    build: ./frontend
    container_name: quiz-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - quiz-network

networks:
  quiz-network:
    driver: bridge

volumes:
  postgres_data:
